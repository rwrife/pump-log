name: Pinned iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: Pump packages (Linux swift test)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install sqlite dev package for GRDB on Linux
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev
      - name: Swift version
        run: swift --version
      - name: Run PumpKit tests
        run: swift test --package-path Packages/PumpKit
      - name: Run PumpStore tests
        run: swift test --package-path Packages/PumpStore
      - name: Zero-network gate
        run: bash scripts/check_zero_network.sh
      - name: Gitignore keeps signing material out
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for f in fake.p8 fake.p12 fake.mobileprovision fake.cer; do
            touch "$f"
            git check-ignore -q "$f" || { echo "FAIL: $f is not gitignored"; exit 1; }
            rm "$f"
          done
          echo "Signing-material gitignore check: PASS"

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run pinned simulator validation
        timeout-minutes: 38
        run: Scripts/ci.sh "$TARGET_SHA"

      - name: Upload results and provenance
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ios-ci-${{ env.TARGET_SHA }}
          path: build/ci-artifacts
          if-no-files-found: warn
          retention-days: 14
